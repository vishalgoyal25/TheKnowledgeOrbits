# ==============================================================================
# render.yaml — Render Infrastructure-as-Code (IaC) manifest
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# Usage: Connect this repo on Render → "New Blueprint" → auto-detects this file
# ==============================================================================

services:
  # ── Django Backend (Web Service) ───────────────────────────────────────────
  - type: web
    name: theknowledgeorbits-backend
    runtime: python
    region: oregon # closest to free-tier Supabase region

    # Build configuration
    buildCommand: "pip install -r backend/requirements/base.txt -r backend/requirements/prod.txt && chmod +x render-build.sh && ./render-build.sh"

    # Start command: runs the Research Agent background worker (django-background-tasks,
    # `process_tasks`) ALONGSIDE gunicorn in the same Starter dyno. process_tasks is
    # backgrounded (&) and executes the LangGraph workflow (run_research) + DeepEval
    # (evaluate_session); gunicorn stays in the foreground and keeps the dyno alive.
    # (Paid Starter dyno = always-on, so the in-process worker never sleeps.)
    # NOTE: the subshell `( … )` is REQUIRED — `cd backend && A & B` parses as
    # `(cd backend && A) &` + `B`, so gunicorn (B) would run from the repo root and
    # fail with `ModuleNotFoundError: No module named 'core'`. Wrapping both in a
    # subshell after `cd backend` makes the `cd` apply to BOTH processes.
    startCommand: "cd backend && (python manage.py process_tasks & gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 120 --keep-alive 10 --max-requests 500 --max-requests-jitter 50)"

    # Pre-deploy: run migrations on DIRECT port (5432) before new version goes live
    # Using 5432 instead of 6543 for migrations is critical for stability.
    preDeployCommand: "cd backend && DB_PORT=5432 python manage.py migrate --noinput"

    healthCheckPath: /api/v1/health/

    # Deploy only after GitHub Actions passes. Declared explicitly so a future
    # Blueprint sync cannot silently reset it to plain `commit`.
    autoDeployTrigger: checksPass

    # Environment variables — set actual secret values in the Render dashboard
    # (Never commit real secrets to this file!)
    envVars:
      # Shared secret group (DB_*, LLM keys, HF token, Sentry, …). Declared so a
      # Blueprint sync can never drop the dashboard link. Only the NAME is here —
      # values stay in Render. Explicit entries below OVERRIDE the group where a
      # key appears in both (service-level env wins), so pinned config is kept.
      - fromGroup: TheKnowledgeOrbits
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.prod
      - key: PYTHONPATH
        value: .
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

      # ── Secrets (set in Render Dashboard → Environment) ────────────────────
      # These are placeholders — override in the Render dashboard UI
      # SECRET_KEY intentionally NOT declared here — the real value lives in the
      # env group. `generateValue` on a Blueprint sync could overwrite the live
      # key and invalidate every session/token, so it must not appear here.

      - key: DEBUG
        value: "False"

      # Render service URL (set after first deploy / use custom domain)
      # Format: theknowledgeorbits-backend.onrender.com
      - key: ALLOWED_HOSTS
        sync: false # Must be set manually in dashboard

      # CSRF origins: include both Render backend URL and Vercel frontend URL
      # e.g. https://theknowledgeorbits-backend.onrender.com,https://theknowledgeorbits.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # CORS: frontend URL(s)
      # e.g. https://theknowledgeorbits.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── Supabase Database ──────────────────────────────────────────────────
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"

      # ── LLM Pool ──────────────────────────────────────────────────────────
      # Multi-provider pool with capability routing + failover. Registry:
      #   engines/book_content/services/llm_service.py → PROVIDERS
      # All *_API_KEY values may be COMMA-SEPARATED to pool several accounts.
      # All *_MODEL values are OPTIONAL — blank uses the registry default.
      #
      # Groq handles small prompts only: its free tier is ~6k tokens/minute, so
      # the ~9k-token Daily CA article prompt is rejected with 413 no matter how
      # many keys exist (a single request cannot be split). Mistral serves those.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false

      # Mistral — large-prompt workhorse. THIS is what generates Daily CA articles.
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        sync: false

      # OpenRouter — emergency fallback only (~50 req/day/account, erratic latency).
      # Leave OPENROUTER_MODEL UNSET: OpenRouter retires free models without notice,
      # so the pool re-resolves the current free model every 24 h. Set it only to
      # pin a model in an emergency — it takes effect without a redeploy.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false

      - key: HF_API_TOKEN
        sync: false
      - key: USE_EMBEDDING_API
        value: "True"

      # ── Research Agent (AgenticAI engine) ─────────────────────────────────
      # REDIS_URL is REQUIRED: SSE pub/sub (worker→browser), Redis rate limiter,
      # query cache, user memory. Use a free Upstash rediss:// URL.
      - key: REDIS_URL
        sync: false
      # DISABLED but RETAINED — every Cerebras key returned 402 Payment Required
      # from 2026-08-19. The provider is switched off in the registry
      # (enabled=False), NOT removed. Keep this var set: restoring Cerebras is a
      # one-boolean change if free access ever returns.
      - key: CEREBRAS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com

      # ── Email (Brevo SMTP) ─────────────────────────────────────────────────
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # ── Frontend URL ──────────────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false # e.g. https://theknowledgeorbits.com

      # ── Monitoring (optional) ─────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ── Cron Jobs ────────────────────────────────────────────────────────────
  # Brought under the Blueprint so a push auto-deploys them alongside the web
  # service (they were dashboard-only → had to be built manually each time).
  #
  # NO render-build.sh here: crons don't serve static files, so no collectstatic
  # and no Build Shield — they only need dependencies installed. DB access
  # happens at RUNTIME (--database=supabase), not at build time.
  #
  # ADOPTION NOTE: both crons already exist as manually-created services with
  # these EXACT names. On first Blueprint sync Render should adopt them by name;
  # if it creates DUPLICATES instead, delete the two old manual crons afterwards
  # (the Terraform-import problem — see FEATURES_SUPABASE_CLEANUP.md Part D).
  #
  # ENV: both crons inherit every secret from the shared Render env group
  # "TheKnowledgeOrbits" (DB_*, LLM keys, HF_API_TOKEN, SENTRY_DSN, …) — the
  # same group already linked to all three services in the dashboard. Only the
  # group NAME lives here; the secret VALUES stay in Render and are never in git.

  - type: cron
    name: tko-generate-daily-ca
    runtime: python
    region: oregon
    schedule: "0 2 * * *" # 02:00 UTC daily
    # Wait for GitHub Actions to pass before deploying. Without this the crons
    # deploy on the raw commit and would pick up code CI is about to reject.
    autoDeployTrigger: checksPass

    # REQUIRED alongside checksPass. The scheduled "Current Affairs Ghost
    # Worker" workflow (.github/workflows/ca_automation.yml, every 12 h) runs
    # against the LATEST commit and posts a fresh set of green checks on it.
    # Render reads that as "checks now pass" and rebuilds the SAME commit —
    # measured twice in 24 h on fb83dd7. The web service was immune only
    # because it kept its build filter; the Blueprint stripped the crons'.
    # Restoring it: rebuild only when backend code actually changes.
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - "**/*.md"
    buildCommand: "pip install -r backend/requirements/base.txt -r backend/requirements/prod.txt"
    # Telemetry retention is CHAINED here rather than given its own cron
    # service: no new service, no new build, no extra Blueprint surface.
    #
    # Separated by ";" and NOT "&&", deliberately. With "&&" the prune would be
    # skipped on any day the pipeline failed — exactly the days you least want
    # retention to stop, since a stalled prune fills the Supabase ceiling and
    # then breaks API writes, not just analytics. prune_telemetry exits 0 even
    # on its own failure, so it can never mark this run red either.
    startCommand: "cd backend && python manage.py run_daily_pipeline --database=supabase; python manage.py prune_telemetry --database=supabase"
    envVars:
      - fromGroup: TheKnowledgeOrbits

  - type: cron
    name: generate-static-content
    runtime: python
    region: oregon
    schedule: "30 3 * * *" # 03:30 UTC daily
    # Same CI gate and build filter as the other cron — see above for why the
    # filter is mandatory when autoDeployTrigger is checksPass.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - "**/*.md"
    buildCommand: "pip install -r backend/requirements/base.txt -r backend/requirements/prod.txt"
    startCommand: "cd backend && python manage.py generate_static_content --max-articles 3 --database=supabase"
    envVars:
      - fromGroup: TheKnowledgeOrbits
